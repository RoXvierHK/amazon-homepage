<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Amazon Homepage Mirror</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Top bar: dark background for the logo, search and account area. -->
<div class="top-bar">
    <!-- Logo: show the Amazon logo from the local icon image. -->
    <div class="logo">
        <img src="img/amazon-icons.png" alt="Amazon">
    </div>
    <!-- End of logo. -->
    
    <!-- Delivery address: location icon and the current delivery destination. -->
     <div class="delivery">
        <!-- Location icon: show the pin from the local icon image. -->
         <div class="location-icon">
            <img src="img/amazon-icons.png" alt="">
         </div>
         <!-- End of location icon. -->
    
         <!-- Delivery text: show the label above the destination. -->
          <div class="delivery-text">
            <p class="delivery-label">Deliver to</p>
            <strong class="delivery-country">Hong Kong</strong>
          </div>
          <!-- End of delivery text. -->
     </div>
     <!-- End of delivery address. -->
</div>
<!-- End of top bar. -->

    <!-- Navigation bar: background for the menu links below the top bar. -->
    <div class="nav-bar"></div>
    <!-- End of navigation bar. -->
</body>
</html>
